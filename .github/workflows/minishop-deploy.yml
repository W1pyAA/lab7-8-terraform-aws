name: Minishop deploy on AWS Lightsail

on:
  push:
    branches: [ "main" ]
    paths:
      - 'minishop/**'
      - 'terraform-minishop/**'
      - '.github/workflows/minishop-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_minishop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push catalog and order images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names minishop-catalog --region eu-central-1 >/dev/null 2>&1 || aws ecr create-repository --repository-name minishop-catalog --region eu-central-1
          aws ecr describe-repositories --repository-names minishop-order --region eu-central-1 >/dev/null 2>&1 || aws ecr create-repository --repository-name minishop-order --region eu-central-1

          docker build -t $ECR_REGISTRY/minishop-catalog:$IMAGE_TAG ./minishop/catalog-service
          docker push $ECR_REGISTRY/minishop-catalog:$IMAGE_TAG
          echo "TF_VAR_catalog_image_uri=$ECR_REGISTRY/minishop-catalog:$IMAGE_TAG" >> $GITHUB_ENV

          docker build -t $ECR_REGISTRY/minishop-order:$IMAGE_TAG ./minishop/order-service
          docker push $ECR_REGISTRY/minishop-order:$IMAGE_TAG
          echo "TF_VAR_order_image_uri=$ECR_REGISTRY/minishop-order:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform-minishop

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -refresh=true
        working-directory: terraform-minishop

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: terraform-minishop